<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BankHome 本地账本</title>
  <desc id="desc">粉紫色可爱账本与钱币图标</desc>
  <defs>
    <linearGradient id="bg" x1="100" y1="70" x2="920" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffadd2"/>
      <stop offset="0.48" stop-color="#f4a6e4"/>
      <stop offset="1" stop-color="#a889ff"/>
    </linearGradient>
    <linearGradient id="bookSpine" x1="170" y1="210" x2="350" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d996ff"/>
      <stop offset="1" stop-color="#8465ee"/>
    </linearGradient>
    <linearGradient id="character" x1="400" y1="320" x2="650" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff76aa"/>
      <stop offset="0.55" stop-color="#d873e6"/>
      <stop offset="1" stop-color="#7f5df2"/>
    </linearGradient>
    <linearGradient id="clasp" x1="760" y1="420" x2="900" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b99bff"/>
      <stop offset="1" stop-color="#7557e8"/>
    </linearGradient>
    <linearGradient id="coin" x1="720" y1="690" x2="900" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb2d0"/>
      <stop offset="1" stop-color="#ff759f"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="25" flood-color="#6b48c7" flood-opacity="0.24"/>
    </filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#6b48c7" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="130" cy="130" r="220" fill="#ffffff" opacity="0.12"/>
  <circle cx="940" cy="900" r="260" fill="#704be0" opacity="0.10"/>
  <path d="M68 744C174 616 310 606 408 682S624 805 789 674 971 610 1024 634V1024H0V852c14-37 36-73 68-108Z" fill="#ffffff" opacity="0.09"/>

  <g filter="url(#softShadow)">
    <rect x="178" y="198" width="648" height="650" rx="116" fill="url(#bookSpine)"/>
    <rect x="258" y="162" width="610" height="660" rx="105" fill="#fffafd"/>
    <rect x="286" y="188" width="554" height="606" rx="82" fill="none" stroke="#dba8f3" stroke-width="10" stroke-linecap="round" stroke-dasharray="24 27" opacity="0.75"/>
    <path d="M268 744h576v44c0 47-38 85-85 85H284c-44 0-80-36-80-80 0-27 12-50 32-65 9 10 20 16 32 16Z" fill="#f7eaff"/>
    <path d="M238 779h590" stroke="#d9bdff" stroke-width="16" stroke-linecap="round" opacity="0.65"/>
    <path d="M244 816h548" stroke="#c7a4fa" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="146" y="324" width="126" height="54" rx="27" fill="#fff9ff"/>
    <rect x="146" y="586" width="126" height="54" rx="27" fill="#fff9ff"/>
  </g>

  <text x="560" y="646" text-anchor="middle" fill="url(#character)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="390" font-weight="800" letter-spacing="-25">账</text>

  <g filter="url(#smallShadow)">
    <path d="M792 422h104c39 0 70 31 70 70v79c0 39-31 70-70 70H792c-36 0-65-29-65-65v-89c0-36 29-65 65-65Z" fill="url(#clasp)"/>
    <circle cx="832" cy="531" r="61" fill="#fff9ff" opacity="0.98"/>
    <path d="M832 565c-10-11-42-31-42-55 0-17 12-30 28-30 8 0 14 4 18 10 5-6 11-10 19-10 16 0 28 13 28 30 0 24-32 44-51 55Z" fill="#ff84b4"/>
  </g>

  <g filter="url(#smallShadow)">
    <circle cx="790" cy="790" r="137" fill="url(#coin)"/>
    <circle cx="790" cy="790" r="107" fill="#fff8fc" stroke="#ffd0e1" stroke-width="12"/>
    <text x="790" y="849" text-anchor="middle" fill="#f36f9e" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="166" font-weight="800">€</text>
  </g>

  <path d="M695 278c12 42 31 61 73 73-42 12-61 31-73 73-12-42-31-61-73-73 42-12 61-31 73-73Z" fill="#ff73ca" stroke="#c95fe6" stroke-width="8"/>
  <path d="M327 805h138v132l-69-42-69 42Z" fill="#ff82ae" filter="url(#smallShadow)"/>
</svg>
