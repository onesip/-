name: Deploy Local Ledger to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rebuild website
        run: |
          mkdir -p _site
          cat \
            site-parts/sitepart_00a \
            site-parts/sitepart_00b \
            site-parts/sitepart_00c \
            site-parts/sitepart_01 \
            site-parts/sitepart_02 \
            site-parts/sitepart_03 \
            site-parts/sitepart_04 \
            | base64 --decode > /tmp/local-ledger-site.tar.gz
          tar -xzf /tmp/local-ledger-site.tar.gz -C _site
          cp mobile-nav.css mobile-nav.js _site/
          sed -i 's#</head>#  <link rel="stylesheet" href="mobile-nav.css?v=20260727c">\n</head>#' _site/index.html
          sed -i 's#</body>#  <script src="mobile-nav.js?v=20260727c"></script>\n</body>#' _site/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
